name: Asset Studio visual evidence

on:
  pull_request:
    branches:
      - main
      - feat/mgsf-m1-5-asset-studio
    paths:
      - 'src/App.tsx'
      - 'src/AssetStudio.tsx'
      - 'src/assetCatalog.ts'
      - 'src/asset-studio.css'
      - 'scripts/asset-studio-browser-smoke.mjs'
      - '.github/workflows/asset-studio-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Browser render snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Kenney original PNG blob hashes
        run: node scripts/verify-kenney-blob-shas.mjs

      - name: Install Japanese fonts for faithful screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK JP'

      - name: Capture safe local screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > visual-evidence/vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null 'http://127.0.0.1:4173/?view=asset-studio'; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null 'http://127.0.0.1:4173/?view=asset-studio'
          BROWSER="$(command -v google-chrome || command -v chromium)"
          if [[ -z "$BROWSER" ]]; then echo 'Chrome/Chromium is missing' >&2; exit 1; fi
          for spec in '1440,980:desktop' '1440,2600:desktop-long' '768,1000:tablet' '390,900:mobile' '320,900:small-mobile'; do
            size="${spec%%:*}"
            label="${spec##*:}"
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --virtual-time-budget=1800 --window-size="$size" \
              --screenshot="visual-evidence/$label.png" \
              'http://127.0.0.1:4173/?view=asset-studio' >/dev/null 2>&1
            test -s "visual-evidence/$label.png"
          done
          file visual-evidence/*.png

      - name: Run real-browser interaction checks
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 \
            --user-data-dir=/tmp/mgsf-browser-smoke about:blank > /tmp/mgsf-chrome.log 2>&1 &
          CHROME_PID=$!
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/mgsf-vite.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$CHROME_PID" "$DEV_PID" 2>/dev/null || true' EXIT
          node scripts/asset-studio-browser-smoke.mjs | tee visual-evidence/browser-smoke.txt

      - name: Attach browser evidence for manual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-studio-visual-evidence
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 7

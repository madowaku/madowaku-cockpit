# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Madowaku Codex Cockpit v0.1"
  slug: "madowaku-codex-cockpit-v0-1"
  kind: specific # specific | open_ended | recovery | audit
  tranche: "Build the smallest lovable local-first cockpit shell: one selected project, one active task, localStorage persistence, note fields, status tracking, and copy-ready /goal-maker and /plan prompt generation."
  status: active # active | blocked | done

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: T062

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: default
    objective: "Map the product intent, constraints, MVP boundary, and first implementation candidates from the owner brief."
    inputs:
      - "Owner brief in chat"
    constraints:
      - "Read-only."
      - "Do not inspect or edit implementation files."
      - "Do not start coding."
      - "Prefer a small local-first v0.1 over general AI IDE scope."
    expected_output:
      - "Product spec"
      - "MVP scope"
      - "UX flow"
      - "Risks and safety constraints"
      - "Candidate first Worker tasks"
    receipt:
      result: done
      summary: "Scout mapped the owner brief into a local-first cockpit product: project choice, rough goal capture, Codex prompt generation, Spec/Plan/Review/result note storage, next-action compression, and status tracking. v0.1 excludes cloud sync, login, billing, direct filesystem writes, shell execution, model calls, and Codex App Server integration."
      evidence:
        - "docs/goals/madowaku-codex-cockpit-v0-1/goal.md"
      candidate_worker_tasks:
        - "Scaffold a Vite + React + TypeScript app with the cockpit data model and static UI."
        - "Implement localStorage persistence for projects and active task state."
        - "Add copy-ready /goal-maker and /plan prompt generation from current fields."
        - "Add responsive polish and manual browser verification."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review Scout findings and choose the first safe implementation task."
    inputs:
      - "T001 receipt"
      - "docs/goals/madowaku-codex-cockpit-v0-1/goal.md"
    constraints:
      - "Do not implement."
      - "Pick work small enough for one focused session."
      - "Avoid model integration, filesystem modification, cloud sync, auth, billing, and command execution."
      - "Prefer Vite + React + TypeScript and localStorage."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Blocked or deferred tasks"
    receipt:
      result: done
      decision: "Choose a single thin vertical slice: scaffold the local React cockpit and implement one-project/one-task persistence plus copy-ready prompt generation. This proves the core loop while keeping all risky integrations out of v0.1."
      next_allowed_task: T003
      exact_worker_objective: "Create the Vite + React + TypeScript cockpit shell with localStorage-backed project/task state, practical playful UI, status tracking, note fields, next-action field, and generated /goal-maker and /plan prompt text."
      allowed_files:
        - "package.json"
        - "package-lock.json"
        - "index.html"
        - "vite.config.ts"
        - "tsconfig.json"
        - "tsconfig.node.json"
        - "src/**"
      verify:
        - "npm run build"
        - "Manual browser check: create/edit project task fields, refresh, confirm localStorage restore."
        - "Manual browser check: generated /goal-maker and /plan prompts include current project, rough goal, status, notes, logs, and next action."
      stop_if:
        - "Need network dependency installation and owner approval is unavailable."
        - "Need files outside allowed_files."
        - "Need filesystem writes from inside the app."
        - "Need cloud, auth, billing, command execution, or model integration."
        - "Behavior becomes ambiguous enough to change the MVP boundary."
      deferred_tasks:
        - "Multiple tasks per project."
        - "Export/import JSON backup."
        - "Project workflow templates."
        - "Optional local model summarization hook."
        - "Codex App Server integration review."

